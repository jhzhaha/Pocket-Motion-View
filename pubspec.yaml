name: dji_live_gallery
description: "适用于 DJI Osmo Pocket 4 与 4P 的实况照片工具，支持桌面预览、逐帧选封面，导出 Apple 实况、Android 与华为动态照片。"
publish_to: 'none'
version: 2.1.6+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.6
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pocket_motion.png
